# Gera os instaladores do Mercadinho ML:
#   - Android: APK (instalar direto no celular) e AAB (Google Play)
#   - iOS:     IPA (assinado se os secrets da Apple estiverem configurados)
#   - Desktop: instalador e versão portátil do Windows (.exe) e instalador do Mac (.dmg)
#
# Como rodar:
#   - Manual: aba "Actions" > "Gerar instaladores" > "Run workflow"
#   - Automático com Release: criar e enviar uma tag, ex.: git tag v1.0.1 && git push origin v1.0.1
#     (os arquivos ficam anexados na página "Releases" do GitHub)
#
# Secrets opcionais (Settings > Secrets and variables > Actions) — veja docs/INSTALADORES.md:
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS:     IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISION_PROFILE_BASE64
#   Variável (não secret) opcional: IOS_EXPORT_METHOD = ad-hoc | app-store | development | enterprise

name: Gerar instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.0.1)'
        required: true
        default: '1.0.0'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versao:
    name: Definir versão
    runs-on: ubuntu-latest
    outputs:
      nome: ${{ steps.v.outputs.nome }}
      codigo: ${{ steps.v.outputs.codigo }}
    steps:
      - id: v
        env:
          INPUT_VERSAO: ${{ inputs.versao }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="${INPUT_VERSAO:-1.0.0}"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Versão inválida: $V (use o formato 1.2.3)"; exit 1; fi
          echo "nome=$V" >> "$GITHUB_OUTPUT"
          echo "codigo=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Versão $V (build $GITHUB_RUN_NUMBER)"

  # ---------------------------------------------------------------- Android
  android:
    name: Android (APK / AAB)
    needs: versao
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VERSION_NAME: ${{ needs.versao.outputs.nome }}
      VERSION_CODE: ${{ needs.versao.outputs.codigo }}
      TEM_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências e compilar o app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Preparar keystore de assinatura
        if: env.TEM_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gerar APK / AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../saida
          if [ "$TEM_KEYSTORE" = "true" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "../saida/Mercadinho-ML-$VERSION_NAME.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../saida/Mercadinho-ML-$VERSION_NAME.aab"
          else
            echo "::warning::Sem keystore configurado: gerando APK de teste (debug). Veja docs/INSTALADORES.md para assinar."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../saida/Mercadinho-ML-$VERSION_NAME-teste.apk"
          fi
          ls -la ../saida

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: saida/*
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  ios:
    name: iOS (IPA)
    needs: versao
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VERSION_NAME: ${{ needs.versao.outputs.nome }}
      VERSION_CODE: ${{ needs.versao.outputs.codigo }}
      TEM_CERTIFICADO: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' }}
      EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
      PBXPROJ: ios/App/App.xcodeproj/project.pbxproj
    defaults:
      run:
        shell: bash # ativa "pipefail": um erro do xcodebuild não fica escondido pelo "| tail"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências e compilar o app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Definir versão no projeto
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $VERSION_CODE;/g" "$PBXPROJ"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $VERSION_NAME;/g" "$PBXPROJ"

      - name: Importar certificado e perfil da Apple
        if: env.TEM_CERTIFICADO == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/assinatura.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/perfil.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" > "$RUNNER_TEMP/perfil.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/perfil.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/perfil.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/perfil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          IDENTIDADE=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | awk '{print $2}')

          # Assinatura manual apenas no alvo do app (as bibliotecas continuam como estão)
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\"; CODE_SIGN_IDENTITY = \"$IDENTIDADE\";/g" "$PBXPROJ"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Gerar IPA assinado
        if: env.TEM_CERTIFICADO == 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive | tail -n 30
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>br.com.mercadinhoml.app</key><string>$PROFILE_UUID</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p saida
          cp "$RUNNER_TEMP"/export/*.ipa "saida/Mercadinho-ML-$VERSION_NAME.ipa"

      - name: Gerar IPA não assinado
        if: env.TEM_CERTIFICADO != 'true'
        run: |
          echo "::warning::Sem certificado da Apple: o IPA gerado NÃO é assinado e não instala direto no iPhone. Veja docs/INSTALADORES.md."
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
          mkdir -p "$RUNNER_TEMP/Payload" saida
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/saida/Mercadinho-ML-$VERSION_NAME-nao-assinado.ipa" Payload)

      - name: Limpar keychain
        if: always() && env.TEM_CERTIFICADO == 'true'
        run: security delete-keychain "$RUNNER_TEMP/assinatura.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: saida/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Desktop
  desktop:
    name: Desktop (${{ matrix.nome }})
    needs: versao
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
            script: electron:build
            arquivos: |
              release/*.exe
          - nome: Mac
            os: macos-latest
            script: electron:build:mac
            arquivos: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # sem certificado de assinatura de código
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Gerar instalador
        shell: bash
        env:
          VERSAO: ${{ needs.versao.outputs.nome }}
        run: |
          npm ci
          npm version "$VERSAO" --no-git-tag-version --allow-same-version
          npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.nome }}
          path: ${{ matrix.arquivos }}
          if-no-files-found: error

  # ---------------------------------------------------------------- Microsoft Store
  # Gera o pacote para enviar à Microsoft Store (a Microsoft assina o app: sem aviso do SmartScreen).
  # Usa os dados de identidade do app reservado no Partner Center, cadastrados como VARIÁVEIS do
  # repositório (Settings > Secrets and variables > Actions > aba Variables):
  #   MS_STORE_IDENTITY_NAME            ex.: 12345MLSoftwares.MercadinhoML  (Package/Identity/Name)
  #   MS_STORE_PUBLISHER                ex.: CN=1A2B3C4D-....               (Package/Identity/Publisher)
  #   MS_STORE_PUBLISHER_DISPLAY_NAME   ex.: ML Softwares                   (Package/Properties/PublisherDisplayName)
  #   MS_STORE_APP_NAME                 nome reservado na Loja, ex.: Mercadinho ML
  # Sem essas variáveis o job é pulado (os demais instaladores continuam sendo gerados).
  loja-microsoft:
    name: Microsoft Store (pacote AppX)
    needs: versao
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # a Loja assina o pacote no envio
      LOJA_IDENTIDADE: ${{ vars.MS_STORE_IDENTITY_NAME }}
      LOJA_EDITOR: ${{ vars.MS_STORE_PUBLISHER }}
      LOJA_EDITOR_NOME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
      LOJA_NOME_APP: ${{ vars.MS_STORE_APP_NAME }}
    steps:
      - name: Conferir dados da Microsoft Store
        id: dados
        shell: bash
        run: |
          if [ -n "$LOJA_IDENTIDADE" ] && [ -n "$LOJA_EDITOR" ] && [ -n "$LOJA_EDITOR_NOME" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pacote da Microsoft Store não gerado: cadastre as variáveis MS_STORE_* do repositório (veja docs/MICROSOFT-STORE.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.dados.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.dados.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Gerar pacote da Loja
        if: steps.dados.outputs.ok == 'true'
        shell: bash
        env:
          VERSAO: ${{ needs.versao.outputs.nome }}
        run: |
          npm ci
          npm version "$VERSAO" --no-git-tag-version --allow-same-version
          npm run build
          npx electron-builder --win appx --publish never \
            -c.appx.identityName="$LOJA_IDENTIDADE" \
            -c.appx.publisher="$LOJA_EDITOR" \
            -c.appx.publisherDisplayName="$LOJA_EDITOR_NOME" \
            -c.appx.displayName="${LOJA_NOME_APP:-Mercadinho ML}" \
            -c.appx.applicationId=MercadinhoML \
            -c.appx.backgroundColor="#1f9d55" \
            -c.appx.languages=pt-BR \
            '-c.appx.artifactName=Mercadinho-ML-${version}-Microsoft-Store.${ext}'
          ls -la release/*.appx

      - uses: actions/upload-artifact@v4
        if: steps.dados.outputs.ok == 'true'
        with:
          name: loja-microsoft
          path: release/*.appx
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: Publicar Release
    needs: [versao, android, ios, desktop, loja-microsoft]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - run: ls -la instaladores

      - uses: softprops/action-gh-release@v2
        with:
          name: Mercadinho ML ${{ needs.versao.outputs.nome }}
          files: instaladores/*
          body: |
            ## Instaladores do Mercadinho ML ${{ needs.versao.outputs.nome }}

            | Plataforma | Arquivo |
            |---|---|
            | Windows (instalador) | `Mercadinho-ML-Setup-*.exe` |
            | Windows (portátil, sem instalar) | `Mercadinho-ML-Portatil-*.exe` |
            | Mac | `Mercadinho-ML-*-mac-arm64.dmg` (Apple Silicon) / `*-mac-x64.dmg` (Intel) |
            | Android | `Mercadinho-ML-*.apk` |
            | Android (Google Play) | `Mercadinho-ML-*.aab` |
            | iPhone / iPad | `Mercadinho-ML-*.ipa` |
            | Microsoft Store (só para enviar no Partner Center, não instala direto) | `Mercadinho-ML-*-Microsoft-Store.appx` |

            > Faça backup dos dados (Configurações → Fazer backup) antes de atualizar.
